      <rect x="317" y="100" width="156" height="32" rx="0" fill="#F64302"/>
    
      <rect x="473" y="100" width="297" height="32" rx="0 8 8 0" fill="#10B981"/>
    
  
      <g transform="translate(30, 160)">
