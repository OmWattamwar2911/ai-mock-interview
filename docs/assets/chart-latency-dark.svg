  <text x="30" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888888">Measured end-of-speech to audio stream: ~1.69s median (Benchmark data: interview-bot/bench, 2026-10-24).</text>
  
      <rect x="30" y="100" width="156" height="32" rx="8 0 0 8" fill="#666666"/>
    
