services:
  rehearse-postgres:
    image: postgres:16-alpine
    container_name: rehearse-postgres
    environment:
      POSTGRES_USER: rehearse
      POSTGRES_PASSWORD: rehearse
      POSTGRES_DB: rehearse
    ports:
      - "5432:5432"
    volumes:
      - rehearse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearse -d rehearse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local development: only Postgres and LiveKit are run via Docker.
  # The web app, AI engine, and compiler are started with `pnpm dev` locally.
  # Judge0 can be started with the `judge0` profile: `docker compose --profile judge0 up -d`.

  livekit:
    image: livekit/livekit-server:latest
    container_name: rehearse-livekit
    command: --dev
    ports:
      - "7880:7880"   # WebSocket / HTTP
      - "7881:7881"   # RTC TCP
      - "7882:7882/udp" # RTC UDP
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  rehearse-judge0-redis:
    profiles: ["judge0"]
    image: redis:7-alpine
    container_name: rehearse-judge0-redis

  rehearse-judge0:
    profiles: ["judge0"]
    image: judge0/judge0:1.13.1
    container_name: rehearse-judge0
    privileged: true
    environment:
      REDIS_HOST: rehearse-judge0-redis
      POSTGRES_HOST: rehearse-postgres
      POSTGRES_DB: rehearse
      POSTGRES_USER: rehearse
      POSTGRES_PASSWORD: rehearse
    ports:
      - "2358:2358"
    depends_on:
      rehearse-postgres:
        condition: service_healthy
      rehearse-judge0-redis:
        condition: service_started

volumes:
  rehearse_pg:
