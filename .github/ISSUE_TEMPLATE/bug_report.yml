name: Bug Report
description: Create a report to help us improve Rehearse
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in Rehearse!
  - type: input
    id: environment
    attributes:
      label: Operating System and Node/Python versions
      placeholder: Windows 11, Node 20.x, Python 3.11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Start services with `pnpm dev`
        2. Navigate to `/interview`
        3. Click 'Run Code'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
